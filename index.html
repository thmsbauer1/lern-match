<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f8a36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lern-Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column app; growing pixel tennis court on top with the two ball friends, dialogue bubbles, chunky block panels, tab bar at bottom */
:root{
  --bg:#edf3df; --panel:#fffdf2; --ink:#1d2a17; --muted:#5b6a4d; --line:#1d2a17;
  --accent:#2a6fb8; --accent-ink:#ffffff; --accent-dark:#1b4f86;
  --clay:#c8643c; --green:#3f8a36; --green-dark:#2b6125; --gold:#dceb2f; --gold-ink:#1d2a17;
  --chip:#e2ebce; --chip-on:#2a6fb8; --chip-on-ink:#ffffff;
  --math:#c8643c; --eng:#2a6fb8; --deu:#3f8a36;
  --lob:#ffe7e4; --acec:#f2f8c6; --guest:#e4f4f4;
  --sky:#9fd6f5; --sun:#ffd25a; --cloud:#ffffff; --hill:#3a7322; --hillpath:#5f8160; --fence:#24553a; --fence2:#183c28;
  --court:#c8643c; --court2:#b4572f; --cline:#f7f2e6; --tree:#3f7d33; --tree2:#5a9a43; --trunk:#8a5a2b;
  --brick:#8a5444; --mortar:#a3a39c; --roof:#a3523f; --roof2:#6e1d14; --robot:#1c7045; --robot2:#3a9a63; --roboteye:#4ed7d4;
  --star-op:0; --glow-op:0;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a22; --panel:#1c2834; --ink:#eef3e2; --muted:#a8b39a; --line:#04070a;
  --accent:#4da3ea; --accent-ink:#0b1022; --accent-dark:#2a6ea8;
  --clay:#e07a52; --green:#6fbf5a; --green-dark:#3d8a31; --gold:#e4f24a; --gold-ink:#141a10;
  --chip:#273546; --chip-on:#4da3ea; --chip-on-ink:#0b1022;
  --math:#e07a52; --eng:#4da3ea; --deu:#6fbf5a;
  --lob:#3b2a31; --acec:#2c381c; --guest:#1d373a;
  --sky:#151d42; --sun:#f1e6b8; --cloud:#5a6488; --hill:#244a1c; --hillpath:#3d5540; --fence:#163626; --fence2:#0e2418;
  --court:#8f4a31; --court2:#7c3f27; --cline:#d8d2c3; --tree:#2a5226; --tree2:#386a2e; --trunk:#5b4030;
  --brick:#5e3b31; --mortar:#6d6d68; --roof:#6e3a30; --roof2:#4a140e; --robot:#155536; --robot2:#24704a; --roboteye:#7ef0ff;
  --star-op:1; --glow-op:1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111a22; --panel:#1c2834; --ink:#eef3e2; --muted:#a8b39a; --line:#04070a;
  --accent:#4da3ea; --accent-ink:#0b1022; --accent-dark:#2a6ea8;
  --clay:#e07a52; --green:#6fbf5a; --green-dark:#3d8a31; --gold:#e4f24a; --gold-ink:#141a10;
  --chip:#273546; --chip-on:#4da3ea; --chip-on-ink:#0b1022;
  --math:#e07a52; --eng:#4da3ea; --deu:#6fbf5a;
  --lob:#3b2a31; --acec:#2c381c; --guest:#1d373a;
  --sky:#151d42; --sun:#f1e6b8; --cloud:#5a6488; --hill:#244a1c; --hillpath:#3d5540; --fence:#163626; --fence2:#0e2418;
  --court:#8f4a31; --court2:#7c3f27; --cline:#d8d2c3; --tree:#2a5226; --tree2:#386a2e; --trunk:#5b4030;
  --brick:#5e3b31; --mortar:#6d6d68; --roof:#6e3a30; --roof2:#4a140e; --robot:#155536; --robot2:#24704a; --roboteye:#7ef0ff;
  --star-op:1; --glow-op:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.55rem;line-height:1.15}
h2{font-size:1.2rem;line-height:1.2}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:14px}

/* Tennisplatz */
.scene{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.scene svg.bg{display:block;width:100%;height:auto;max-height:240px}
.scene .duospot{position:absolute;left:max(6px,env(safe-area-inset-left,0px));bottom:2%;display:flex;align-items:flex-end;gap:0}
.ch{flex:none;cursor:pointer;height:auto;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.18));animation:bob 2.6s ease-in-out infinite}
.ch.lobbi{width:clamp(80px,21vw,118px);aspect-ratio:30/24}
.ch.ace{width:clamp(56px,14.5vw,80px);aspect-ratio:20/18;animation-delay:-1.3s;margin-left:-4px}
.eyes-closed{opacity:0}
.ch .eyes-open,.av .eyes-open{animation:blinkO 5s infinite}
.ch .eyes-closed,.av .eyes-closed{animation:blinkC 5s infinite}
.av.ace .eyes-open,.av.ace .eyes-closed{animation-delay:-3s}
.ch.ace .eyes-open{animation-delay:-2.2s}.ch.ace .eyes-closed{animation-delay:-2.2s}
.armA{animation:armA 1.4s steps(1) infinite}
.armB{animation:armB 1.4s steps(1) infinite}
@keyframes armA{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes armB{0%,55%{opacity:0}56%,100%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blinkO{0%,92%{opacity:1}93%,97%{opacity:0}98%,100%{opacity:1}}
@keyframes blinkC{0%,92%{opacity:0}93%,97%{opacity:1}98%,100%{opacity:0}}
.ch.hop,.av.hop{animation:hop .5s ease-out}
@keyframes hop{40%{transform:translateY(-14px) scale(1.06,.94)}}
.ch.shake,.av.shake{animation:shake .45s steps(6)}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.item-new{animation:itemnew 1.2s ease-out}
@keyframes itemnew{0%{transform:translateY(-14px);opacity:0}60%{transform:translateY(2px);opacity:1}100%{transform:none}}
.tappable{cursor:pointer}
.cloud{animation:cloud 60s linear infinite}
.cloud.c2{animation-duration:85s;animation-delay:-40s}
@keyframes cloud{from{transform:translateX(-30px)}to{transform:translateX(180px)}}
.rocket{animation:rocket 34s linear infinite;animation-delay:-6s}
@keyframes rocket{0%{transform:translate(-40px,14px)}30%{transform:translate(175px,6px)}100%{transform:translate(175px,6px)}}
.rocket .flA{animation:flA .24s steps(1) infinite}.rocket .flB{animation:flB .24s steps(1) infinite}
.guest .flA{animation:flA .24s steps(1) infinite}.guest .flB{animation:flB .24s steps(1) infinite}
@keyframes flA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flB{0%,49%{opacity:0}50%,100%{opacity:1}}
.rally{animation:rally 2.8s linear infinite}
@keyframes rally{0%{transform:translate(98px,51px)}12%{transform:translate(96.5px,45px)}25%{transform:translate(94px,42px)}37%{transform:translate(91px,48px)}50%{transform:translate(86px,65px)}62%{transform:translate(89px,52px)}75%{transform:translate(93px,45px)}87%{transform:translate(96px,46px)}100%{transform:translate(98px,51px)}}
.shot{opacity:0}
.shot.go{animation:shot .9s ease-out}
@keyframes shot{0%{opacity:1;transform:translate(105px,45px)}50%{opacity:1;transform:translate(90px,40px)}100%{opacity:1;transform:translate(66px,66px)}}
.birds{animation:birds 26s linear infinite}
@keyframes birds{from{transform:translateX(-20px)}to{transform:translateX(180px)}}
.cheer>g{animation:cheer 1.1s ease-in-out infinite}
.cheer>g:nth-child(2){animation-delay:-.3s}.cheer>g:nth-child(3){animation-delay:-.6s}.cheer>g:nth-child(4){animation-delay:-.15s}.cheer>g:nth-child(5){animation-delay:-.8s}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.cheer.go>g{animation:cheergo .3s steps(2) 4}
@keyframes cheergo{50%{transform:translateY(-2px)}}
.twinkle{animation:twinkle 2.2s steps(1) infinite}
@keyframes twinkle{0%,70%{opacity:0}71%,85%{opacity:1}86%,100%{opacity:0}}
.wave{animation:wave 1s steps(2) infinite}
@keyframes wave{50%{transform:translateY(-.6px)}}
.wiggle{animation:wiggle .5s steps(4)}
@keyframes wiggle{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}

/* Dialog: Lobbi fragt, Ace erklärt */
.duo{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:8px;align-items:flex-end}
.av{flex:none;height:auto;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.18))}
.av.lobbi{width:52px;aspect-ratio:30/24}
.av.ace{width:40px;aspect-ratio:20/18;margin:0 6px 0 6px}
.av.guest-av{width:46px;height:46px;border:3px solid var(--line);background:var(--gbg);display:grid;place-items:center;overflow:hidden}
.av.guest-av svg{width:100%;height:auto}
.bubble{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:9px 12px;font-weight:700;font-size:.98rem;line-height:1.38;min-width:0;flex:1;cursor:pointer}
.bubble::before{content:"";position:absolute;left:-12px;bottom:12px;width:12px;height:12px;background:inherit;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:skewY(-35deg)}
.bubble.lob{background:var(--lob)}
.bubble.ace{background:var(--acec)}
.bubble.gst{background:var(--guest)}
.bubble .who{display:block;font-family:var(--f-display);font-size:.78rem;color:var(--muted);line-height:1.1;margin-bottom:2px}
.bubble.ok{border-left-width:10px;border-left-color:var(--green)}
.bubble.no{border-left-width:10px;border-left-color:var(--clay)}
.bubble.near{border-left-width:10px;border-left-color:var(--gold)}
.bubble.ok::before,.bubble.no::before,.bubble.near::before{display:none}
.bubble b.big{font-family:var(--f-body);font-weight:800;font-size:1.2rem;display:block}
.bubble .ex{font-weight:700;margin-top:4px}
.tw-hide{visibility:hidden}

/* stats */
.stats{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.balls{font-family:var(--f-body);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.ball-ico{width:22px;height:22px;flex:none}
.week{display:flex;gap:5px;justify-content:flex-end}
.week span{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.62rem;font-weight:800;color:var(--muted);line-height:1}
.week i{width:18px;height:18px;border:3px solid var(--line);background:var(--chip);display:block}
.week i.on{background:var(--gold)}
.week span.today{color:var(--ink)}
.bar{height:14px;border:3px solid var(--line);background:var(--chip);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--clay) 0 10px,#9e4728 10px 12px)}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:12px 16px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);box-shadow:inset 0 -5px 0 var(--accent-dark),3px 3px 0 var(--line);display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:50px}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 -3px 0 var(--accent-dark),1px 1px 0 var(--line)}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn.big{width:100%;font-size:1.2rem;min-height:58px}
.btn.green{background:var(--green);color:#fff;box-shadow:inset 0 -5px 0 var(--green-dark),3px 3px 0 var(--line)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset 0 -5px 0 var(--chip),3px 3px 0 var(--line)}
.btn.danger{background:var(--clay);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),3px 3px 0 var(--line)}
.linkbtn{all:unset;cursor:pointer;font-weight:800;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.snd{all:unset;cursor:pointer;font-size:1.2rem;padding:4px 8px;border:3px solid var(--line);background:var(--panel);line-height:1.2;box-shadow:2px 2px 0 var(--line)}

/* subject cards */
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.subj{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px;border:3px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 var(--line);min-height:108px;position:relative;overflow:hidden}
.subj::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.subj:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.subj:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.subj .em{font-size:1.6rem;line-height:1;margin-top:6px}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj span{font-size:.78rem;color:var(--muted);font-weight:800;line-height:1.25}

/* Match */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.score{display:flex;gap:6px;margin-top:10px;align-items:stretch}
.score>div{background:#1f4a2c;color:#f4f8e6;border:3px solid var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.score .lbl2{font-family:var(--f-display);font-size:.66rem;opacity:.8;letter-spacing:.03em}
.score .val{font-family:var(--f-body);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.score .val.pt{color:#e4f24a}
.score .set{flex:1}
.score .pop{animation:pop .6s ease-out}
@keyframes pop{30%{transform:scale(1.25)}}
.prog{display:flex;gap:3px;margin-top:8px}
.prog i{flex:1;height:10px;border:2px solid var(--line);background:var(--chip)}
.prog i.ok{background:var(--green)}
.prog i.no{background:var(--clay)}
.prog i.cur{background:var(--gold)}
.tag{display:inline-block;font-family:var(--f-body);font-weight:800;font-size:.85rem;padding:2px 8px;border:2px solid var(--line);color:#fff;background:var(--c)}
.q{font-size:1.25rem;font-weight:800;line-height:1.35}
.q.big{font-size:2.1rem;text-align:center;font-variant-numeric:tabular-nums}
.q .hl{background:var(--gold);color:var(--gold-ink);padding:0 6px;border:2px solid var(--line)}
.gap{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--accent);text-align:center;color:var(--accent)}
.answer{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:2rem;min-height:64px;border:3px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.answer .unit{font-size:1.1rem;color:var(--muted)}
.answer .cursor{width:3px;height:1.4em;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-weight:800;font-size:1.7rem;min-height:58px;display:grid;place-items:center;background:var(--chip);border:3px solid var(--line);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.ok{background:var(--green);color:#fff}
.key:focus-visible{outline:3px dashed var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:12px 14px;background:var(--chip);border:3px solid var(--line);font-weight:800;font-size:1.1rem;min-height:52px}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--clay);color:#fff}
.opt[disabled]{cursor:default}
.opt:focus-visible{outline:3px dashed var(--accent)}
.opts.grid{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.grid .opt{text-align:center;font-size:1.5rem}
.inp{width:100%;background:var(--bg);border:3px solid var(--line);padding:12px;font-size:1.3rem;font-weight:800;min-height:56px}
select.inp{min-height:48px}
.col{font-family:"Courier New",monospace;font-weight:800;font-size:1.6rem;line-height:1.25;display:inline-grid;justify-items:end;padding:6px 10px;background:var(--bg);border:3px solid var(--line)}
.col .line2{width:100%;border-top:3px solid var(--ink);margin-top:2px}
.wall{display:flex;flex-direction:column;align-items:center;gap:4px}
.wall .r{display:flex;gap:4px}
.wall .b{min-width:58px;padding:6px 4px;text-align:center;font-weight:800;font-size:1.25rem;background:var(--chip);border:3px solid var(--line)}
.wall .b.ask{background:var(--gold);color:var(--gold-ink)}
.speak{all:unset;cursor:pointer;font-weight:800;padding:4px 10px;border:3px solid currentColor;display:inline-flex;gap:6px;align-items:center;margin-top:6px}

/* Gäste */
.guest{position:relative;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);background:var(--gbg);height:170px;overflow:hidden;display:grid;place-items:center}
.guest svg{height:140px;width:auto;max-width:90%}
.guest .gname{position:absolute;left:8px;bottom:8px;font-family:var(--f-display);font-size:1rem;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px}
.guest.zoom svg{animation:zoom 1.1s ease-out}
@keyframes zoom{0%{transform:translateX(-120%)}70%{transform:translateX(6%)}100%{transform:none}}
.guest.slide svg{animation:slide .8s ease-out}
@keyframes slide{0%{transform:translateX(110%)}100%{transform:none}}
.guest.drop svg{animation:drop .8s ease-out}
@keyframes drop{0%{transform:translateY(-120%)}70%{transform:translateY(4%)}100%{transform:none}}

/* Ergebnis-Tafel */
.board{background:#1f4a2c;color:#f4f8e6;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px 12px}
.board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{font-family:var(--f-display);font-weight:500;font-size:.78rem;text-align:right;opacity:.8;padding:2px 4px}
.board th:first-child,.board td:first-child{text-align:left}
.board td{font-weight:800;font-size:1.05rem;padding:4px;text-align:right;border-top:2px solid rgba(255,255,255,.15)}
.board td.g{color:#e4f24a;font-size:1.3rem}

/* words + misc */
.wlist{display:flex;flex-direction:column;gap:8px}
.w{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border:3px solid var(--line);background:var(--panel)}
.w .en{font-weight:800}
.w .de{font-size:.85rem;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:14px;border:2px solid var(--line);background:var(--chip)}
.pips i.on{background:var(--green)}
.w .say{all:unset;cursor:pointer;font-size:1.2rem;padding:2px 6px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.tab .em{font-size:1.35rem;line-height:1}
.tab[aria-current="page"]{color:var(--ink);background:var(--chip);box-shadow:inset 0 4px 0 var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-display);padding:10px 16px;border:3px solid var(--line);z-index:40;max-width:calc(100% - 32px);text-align:center}
.note{font-size:.85rem;color:var(--muted);border-left:4px solid var(--gold);padding-left:10px}
.flyer{position:fixed;z-index:45;pointer-events:none;display:flex;align-items:center;gap:4px;font-weight:800;font-size:1.3rem;color:var(--green);text-shadow:2px 2px 0 var(--panel);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.banner{position:fixed;left:50%;top:38%;z-index:46;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:700;font-size:2rem;color:#1d2a17;background:#e4f24a;border:3px solid #1d2a17;box-shadow:4px 4px 0 #1d2a17;padding:8px 18px;animation:banner 1.3s ease-out forwards;white-space:nowrap}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.rain{position:fixed;top:-30px;z-index:45;pointer-events:none;animation:rain linear forwards}
@keyframes rain{to{transform:translateY(110vh) rotate(var(--r))}}
.enter{animation:slidein .28s ease-out}
@keyframes slidein{from{transform:translateX(28px);opacity:.3}}
.big-num{font-weight:800;font-size:2.6rem;line-height:1;color:var(--green)}
textarea.inp{min-height:180px;font-size:.9rem;font-weight:600}
label.lbl,.lbl{font-weight:800;display:block;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 12px;border:3px solid var(--line);background:var(--chip);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names .inp{font-size:1rem}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
.quiz .opts{margin-top:2px}
.quiz .opt{font-size:1rem;min-height:46px;padding:10px 12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script>window.__SW__=true;</script>
<div id="app" class="wrap"></div>

<script src="inhalte.js"></script>
<script>
"use strict";
/* ---------- Grundlagen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickA=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const r10=n=>Math.round(n/10)*10;
const fmt=n=>n.toLocaleString("de-DE");
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(key,n){const d=new Date(key+"T12:00:00");d.setDate(d.getDate()+n);return today(d);}
function weekKeys(){const d=new Date();d.setHours(12,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);const k=[];for(let i=0;i<7;i++){k.push(today(d));d.setDate(d.getDate()+1);}return k;}

/* ---------- Speicher ---------- */
const KEY="lern-match-v1",OLD_KEY="fennek-lernoase-v1";let memStore=null,storeOk=true;
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null;}catch(e){storeOk=false;return memStore;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storeOk=false;memStore=JSON.parse(JSON.stringify(S));}}
function blank(){return {v:1,name:"",aceName:"Ace",lobName:"Lobbi",sound:true,pitch:1.6,voice:"",newPerDay:5,len:"normal",balls:0,missions:{},days:{},m:{},en:{},de:{},hist:{},quiz:{},qn:0,setupDone:false,imported:false};}
let S=Object.assign(blank(),load()||{});
/* Lernstand aus Fenneks Lern-Oase: liegt auf derselben Webadresse, daher hier lesbar */
function oldData(){try{const t=localStorage.getItem(OLD_KEY);if(!t)return null;const o=JSON.parse(t);return o&&typeof o==="object"?o:null;}catch(e){return null;}}
function importOld(o){
  if(!o)return;S.en=o.en||{};S.de=o.de||{};S.m=o.m||{};S.hist=o.hist||{};
  ["voice","pitch","sound","newPerDay","len"].forEach(k=>{if(o[k]!==undefined&&o[k]!=="")S[k]=o[k];});
  S.balls=(S.balls||0)+(o.dates||0);Object.keys(o.missions||{}).forEach(k=>{S.days[k]=true;});
  S.imported=true;UI.justImported={words:Object.keys(S.en).length,days:Object.keys(o.missions||{}).length,balls:o.dates||0};
}
const AN=()=>S.aceName||"Ace",LN=()=>S.lobName||"Lobbi";

/* ---------- Pixel-Figuren (nach Philips Zeichnungen) ---------- */
const MAPS={"ACE":["......oo.oo.oo......",".....oyyoyyoyyo.....","....ooyyyyyyyyoo....","...oyyyyyyyyyyyyo...","..owllyyyyyyyyyywo..","..owlyyyyyyyyyyywo..",".oywyyyyyyyyyyyywyo.",".oyywyyyyyyyyyywyyo.",".oyywyeeyyyyeeywyyo.",".oyywyeeyyyyeeywyyo.",".oyywyyyyyyyyyywyyo.",".oywyyyyyeyyyyyywyo.","..owyyyyyyyyyyyywo..","..owyyeyyyyyyeyywo..","...oyyyeeeeeeyyyo...","....oyyyyyyyyyyo....",".....ooyyyyyyoo.....",".......oooooo......."],"LOBBI":["..........h.hh..hh.h..........","........hhhhhhhhhhhhhh........",".......hhhHhhhhhhHhhhhh.......","......hhhhhhhhHhhhhhhhhh......","......hhHhhhhhhhhhhhhHhh......","......hhhhhhHhhhhhHhhhhh......","a.....hhyhhhyhhhyhhyhhho.....a","aa....ohyyhyyyhyyyhyyhwo....aa",".aa..oywyyyyyyyyyyyyyywyo..aa.","b.aa.oywyyyeeyyyyeeyyywyo.aa.b","bbbaaoywyyyeeyyyyeeyyywyoaabbb",".bbbcoywyyyyyyyyyyyyyywyocbbb.","...bboywyyyyyyeeyyyyyywyobb...",".....owyyyyyyyyyyyyyyyywo.....","......oyyeyyyyyyyyyyeyyo......","......oyyyeeyyyyyyeeyyyo......",".......oyyyeeeeeeeeyyyo.......","........ooyyyyyyyyyyoo........","..........oooooooooo..........","..........cc......cc..........","..........cc......cc..........","..........cc......cc..........","..........cc......cc..........",".........fff......fff........."],"JAY":["........................","........................",".........kkkkkkk........",".......kkmmmmmmmmk......",".....kkmmmmmmWWmmmkk....",".....kmmmmmmWWmmmmmk....","....kmmmmmmWWWWWmmmmk...","....kmmmmmmmmWWmmmmmk...","MkkkmmmmmmmmWWmmmmmmmkk.","MMMMMMMMMMMMMMMMMMMMMM..",".....kppppppppppppppk...","....kppppppppeeeeeeeek..","....kpppppppppppepeeek..","....kppppppppppppeeepk..","...kppppppppppppppppppk.","...kppppppppppepppppppk.","....kpppppppppepppeppk..","....kppppppppppeeepppk..","....kppppppppppppppppk..",".....kppppppppppppppk..."],"BO":["............k...........","..........kkhkk.........","........kkHhhHHkk.......","......kkhHhHHhhHhkk.....","....kkhhHhhHHhHhHHhkk...","..kkHHhHhHHhhHhhHHhHhkk.",".kkHhhHhhHHhHhHHhhHhhHkk","...kkkkHHhhHhhHHhHhkkk..",".......kHhHhHHhhHhk.....","......kssssssssssk......","......ksssssssessk......",".....kssssssseeessk.....",".....ksssqqsssssssk.....",".....kssssssessessk.....","......ksssssseessk......","......kssttttttssk......",".......ktttttttttk......",".....kktttttttttttkk....",".....ktttttttttttttk...."],"ROCKET":["..................kkkkkk......",".........kkkkkkkkkcCCccck.....","......kkkrrrrrrrkcCckkkcck....",".....krkrrrkrrrrkcccckcGck....","....krrkkrkkrrrrkcccckccck....","....krrkrkrkrrrrrkkkkkkkk.....","....krrkrrrkrrrrrrrrrrrrk.....",".....krrrrrrGrGrGrrrrrk.......","......kkrrrGrGrGrGrrkk........","........kkkkkkrrkkkk..........","..............rr..............","..f.Ff.FfYbbbbrbbbbbbbbbbbb...","FFfYYYYYYYbbbrrrrbbrrbbbbbbbb.",".FfYYYYYYYbbbrbbbrrbbbbbbbbb..","..F.fF.fYfbbbbbbbbbbbbbbbb...."],"FLAME2":[".f.F.fFf.Y","FfFYYYYYYY","FFfYYYYYYY",".F.fF.fFYf"]};
const PAL_ACE={o:"#5c6a10",y:"#e2f23a",l:"#f6ffa8",w:"#ffffff",e:"#1b1714"};
const PAL_LOB={o:"#8f6b1d",y:"#f8e68e",w:"#fff8d6",e:"#1b1714",h:"#ff7a78",H:"#e85a62",a:"#e7cf62",b:"#e7cf62",c:"#e7cf62",f:"#8f6b1d"};
const PAL_G={p:"#fbb6b8",m:"#c01f78",M:"#8e1257",W:"#ffffff",k:"#1b1714",e:"#1b1714",s:"#f3d0a4",q:"#f2a5a0",t:"#efe6d2",h:"#e8c46a",H:"#b8893c",r:"#e8213f",c:"#7ef0ff",C:"#d6fbff",G:"#36d43a",b:"#1b1714",F:"#ffd23a",f:"#ff8a1f",Y:"#e8213f"};
const rc=(x,y,col)=>`<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${col}"/>`;
function spriteInner(map,pal,o){o=o||{};let body="",open="",closed="",ga="",gb="",fa="",fb="";
  map.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==="."||!pal[c])return;
    if(o.blink&&c==="e"&&o.blink.includes(y)){open+=rc(x,y,pal.e);closed+=rc(x,y,y===o.blink[1]?pal.o:pal.y);}
    else if(o.arms&&c==="a")ga+=rc(x,y,pal.a);
    else if(o.arms&&c==="b")gb+=rc(x,y,pal.b);
    else if(o.flame&&x<10&&"FfY".includes(c))fa+=rc(x,y,pal[c]);
    else body+=rc(x,y,pal[c]);}));
  if(o.flame)MAPS.FLAME2.forEach((row,j)=>[...row].forEach((c,x)=>{if(c!==".")fb+=rc(x,11+j,pal[c]);}));
  return `${o.arms?`<g class="armA">${ga}</g><g class="armB">${gb}</g>`:""}${o.flame?`<g class="flA">${fa}</g><g class="flB">${fb}</g>`:""}${body}${o.blink?`<g class="eyes-open">${open}</g><g class="eyes-closed">${closed}</g>`:""}`;
}
const SPR={};
function spr(k){if(!SPR[k]){SPR[k]=k==="ace"?spriteInner(MAPS.ACE,PAL_ACE,{blink:[8,9]}):k==="lob"?spriteInner(MAPS.LOBBI,PAL_LOB,{blink:[9,10],arms:true}):k==="jay"?spriteInner(MAPS.JAY,PAL_G):k==="bo"?spriteInner(MAPS.BO,PAL_G):spriteInner(MAPS.ROCKET,PAL_G,{flame:true});}return SPR[k];}
function aceSVG(cls,act){return `<svg class="${cls||"ch ace"}" ${act===false?"":'data-act="ace"'} viewBox="0 0 20 18" shape-rendering="crispEdges" role="img" aria-label="${esc(AN())}">${spr("ace")}</svg>`;}
function lobSVG(cls,act){return `<svg class="${cls||"ch lobbi"}" ${act===false?"":'data-act="lob"'} viewBox="0 0 30 24" shape-rendering="crispEdges" role="img" aria-label="${esc(LN())}">${spr("lob")}</svg>`;}
const GUESTS={
  m:{n:"Die Mathe-Rakete",bg:"#8ab8ff",vb:"0 0 30 15",k:"rocket",anim:"zoom"},
  e:{n:"Jay",bg:"#37bcc1",vb:"0 0 24 20",k:"jay",anim:"slide"},
  d:{n:"Bo",bg:"#731a1a",vb:"0 0 24 19",k:"bo",anim:"drop"}
};
function guestSVG(s,cls){const g=GUESTS[s];return `<svg class="${cls||""}" viewBox="${g.vb}" shape-rendering="crispEdges" role="img" aria-label="${esc(g.n)}">${spr(g.k)}</svg>`;}
function px(map,fills,ox,oy){let r="";map.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=="."&&fills[c])r+=`<rect x="${ox+x}" y="${oy+y}" width="1.04" height="1.04" fill="${fills[c]}"/>`;}));return r;}
const BALL=["..oooo..",".owyyyo.","oyywyyyo","oyyywyyo","oyyywyyo","oyywyyyo",".owyyyo.","..oooo.."];
function ballSVG(){return `<svg class="ball-ico" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${px(BALL,{o:"#5c6a10",y:"#dceb2f",w:"#ffffff"},0,0)}</svg>`;}

/* ---------- Der Tennisplatz ---------- */
const WUERFLI=["kkkkkkkkk","kgggggggk","kgEEgEEgk","kgEegEegk","kgggggggk","kgLgLgLgk","kgLgLgLgk","kkkkkkkkk",".k.....k.",".k.....k."];
const GLYPH={"0":["111","1.1","1.1","1.1","111"],"1":[".1.","11.",".1.",".1.","111"],"4":["1.1","1.1","111","..1","..1"],"5":["111","1..","111","..1","111"],":":[".","1",".","1","."]};
function pxText(str,x,y,col){let r="",cx=x;for(const ch of str){const g=GLYPH[ch];g.forEach((row,j)=>[...row].forEach((c,i)=>{if(c==="1")r+=`<rect x="${cx+i}" y="${y+j}" width="1.04" height="1.04" fill="${col}"/>`;}));cx+=g[0].length+1;}return r;}
function hillSVG(){let r="";for(let x=0;x<=46;x++){const t=(x+.5-19)/26;if(Math.abs(t)>=1)continue;const top=Math.round(48-21*Math.sqrt(1-t*t));r+=`<rect x="${x}" y="${top}" width="1.04" height="${49-top}" fill="var(--hill)"/>`;if(top+8<48)r+=`<rect x="${x}" y="${top+4}" width="1.04" height="3" fill="var(--hillpath)"/>`;}
  return `<g class="tappable" data-act="hill">${r}</g>`;}
function towerSVG(){let r="";for(let i=0;i<=10;i++){const hw=Math.round(i*.62);for(let x=150-hw;x<=150+hw;x++)r+=`<rect x="${x}" y="${14+i}" width="1.04" height="1.04" fill="${(x+i)%3===0||(x-i)%4===0?"var(--roof2)":"var(--roof)"}"/>`;}
  r+=`<rect x="143" y="25" width="15" height="2" fill="var(--mortar)"/><rect x="145" y="27" width="11" height="22" fill="var(--brick)"/>`;
  for(let y=30;y<48;y+=4){r+=`<rect x="145" y="${y}" width="11" height="1" fill="var(--mortar)"/>`;const off=(y/4)%2?0:3;for(let x=145+off;x<156;x+=5)r+=`<rect x="${x}" y="${y-3}" width="1" height="3" fill="var(--mortar)"/>`;}
  return `<g class="tappable" data-act="turm">${r}<rect x="142" y="13" width="17" height="36" fill="transparent"/></g>`;}
const COURT=[
  {n:"ein Netz",layer:"net",d:()=>`<g class="tappable" data-act="netz"><rect x="50" y="52" width="1" height="10" fill="#3b3b3b"/><rect x="129" y="52" width="1" height="10" fill="#3b3b3b"/><rect x="51" y="57" width="78" height="4" fill="url(#mesh)"/><rect x="50" y="56" width="80" height="1" fill="#ffffff"/><rect x="89" y="57" width="1" height="4" fill="#ffffff"/><rect x="50" y="54" width="80" height="8" fill="transparent"/></g>`},
  {n:"Würfli, die Ballmaschine",layer:"far",d:()=>`<g class="tappable" data-act="wuerfli"><g class="wv">${px(WUERFLI,{k:"#0f2a1b",g:"var(--robot)",E:"var(--roboteye)",e:"#2a8a96",L:"var(--robot2)"},101,41)}</g><rect x="99" y="39" width="13" height="14" fill="transparent"/></g>`},
  {n:"der Clubhaus-Turm",layer:"back",d:()=>towerSVG()},
  {n:"ein Schiedsrichterstuhl",layer:"front",d:()=>`<g class="tappable" data-act="stuhl"><rect x="131" y="51" width="1" height="11" fill="#3a3a3a"/><rect x="137" y="51" width="1" height="11" fill="#3a3a3a"/><rect x="131" y="54" width="7" height="1" fill="#3a3a3a"/><rect x="131" y="58" width="7" height="1" fill="#3a3a3a"/><rect x="130" y="49" width="9" height="2" fill="#f2efe4"/><rect x="137" y="43" width="2" height="7" fill="#f2efe4"/><rect x="129" y="42" width="11" height="21" fill="transparent"/></g>`},
  {n:"eine Anzeigetafel",layer:"fence",d:()=>`<g class="tappable" data-act="tafel"><rect x="60" y="38" width="1" height="3" fill="#3a3a3a"/><rect x="77" y="38" width="1" height="3" fill="#3a3a3a"/><rect x="57" y="29" width="24" height="10" fill="#10251a"/><rect x="57" y="29" width="24" height="1" fill="#2d5a3d"/>${pxText("40:15",59,31,"#ffd25a")}</g>`},
  {n:"eine Bank mit Trinkflasche",layer:"front",d:()=>`<g><rect x="141" y="62" width="16" height="1" fill="#7a4a1e"/><rect x="141" y="65" width="16" height="1" fill="#8a5a2b"/><rect x="142" y="63" width="1" height="5" fill="#5a3a22"/><rect x="155" y="63" width="1" height="5" fill="#5a3a22"/><rect x="149" y="62" width="2" height="3" fill="#2a6fb8"/><rect x="149" y="61" width="2" height="1" fill="#ffffff"/><rect x="152" y="64" width="3" height="1" fill="#e85a62"/></g>`},
  {n:"ein Ballkorb",layer:"front",d:()=>`<g class="tappable" data-act="korb"><rect x="114" y="61" width="9" height="6" fill="#8d969a"/><rect x="115" y="61" width="7" height="5" fill="#dceb2f"/><g fill="#a9b81e"><rect x="116" y="62" width="1" height="1"/><rect x="119" y="61" width="1" height="1"/><rect x="118" y="64" width="1" height="1"/><rect x="121" y="63" width="1" height="1"/></g><rect x="116" y="60" width="2" height="1" fill="#dceb2f"/><rect x="119" y="59" width="2" height="2" fill="#dceb2f"/><rect x="114" y="67" width="1" height="2" fill="#5d6468"/><rect x="122" y="67" width="1" height="2" fill="#5d6468"/></g>`},
  {n:"bunte Wimpel",layer:"fence",d:()=>{let r="";const cols=["#e8213f","#2a6fb8","#dceb2f","#ffffff","#3f8a36","#ff8a1f"];for(let i=0;i<23;i++){const x=1+i*7;r+=`<g class="wave" style="animation-delay:${-(i%5)*.2}s"><rect x="${x}" y="41" width="3" height="1" fill="${cols[i%cols.length]}"/><rect x="${x+1}" y="42" width="1" height="1" fill="${cols[i%cols.length]}"/></g>`;}return `<g>${r}</g>`;}},
  {n:"ein Baum",layer:"back",d:()=>`<g class="tappable" data-act="baum"><rect x="42" y="30" width="3" height="11" fill="var(--trunk)"/><rect x="36" y="18" width="15" height="12" fill="var(--tree)"/><rect x="38" y="15" width="11" height="3" fill="var(--tree)"/><rect x="34" y="21" width="2" height="7" fill="var(--tree)"/><rect x="51" y="21" width="2" height="7" fill="var(--tree)"/><rect x="38" y="30" width="11" height="2" fill="var(--tree)"/><rect x="39" y="18" width="3" height="2" fill="var(--tree2)"/><rect x="45" y="22" width="2" height="2" fill="var(--tree2)"/><rect x="40" y="25" width="2" height="1" fill="var(--tree2)"/></g>`},
  {n:"jubelnde Zuschauer",layer:"fence",d:()=>{const fan=(x,hair,shirt,cap)=>`<g><rect x="${x}" y="36" width="3" height="3" fill="#f1c9a0"/><rect x="${x}" y="35" width="3" height="1" fill="${hair}"/>${cap?`<rect x="${x-1}" y="35" width="2" height="1" fill="${hair}"/>`:""}<rect x="${x}" y="39" width="3" height="1" fill="${shirt}"/></g>`;
    return `<g class="cheer tappable" data-act="fans">${fan(86,"#5a3a22","#2a6fb8")}${fan(92,"#e8c46a","#e8213f")}${fan(98,"#1b1714","#ffd25a",true)}${fan(104,"#c01f78","#3f8a36")}${fan(110,"#8a5a2b","#ffffff")}<rect x="84" y="33" width="30" height="7" fill="transparent"/></g>`;}},

function mTask(skill){const g=GEN[skill](lvl(skill));return Object.assign({subj:"m",kind:g.kind||"num",skill},g);}
function mTasks(n){
  const acc=k=>{const s=S.m[k];return s&&s.n?s.ok/s.n:.6;};
  const fixed=["plus","minus",pickA(["mal","geteilt"]),"text"];
  const rest=Object.keys(SKILLS).filter(k=>!fixed.includes(k));
  const chosen=fixed.slice(0,Math.min(4,n));
  while(chosen.length<n){const w=rest.map(k=>({k,w:1.4-acc(k)+(chosen.includes(k)?-0.9:0)+Math.random()*.6})).sort((a,b)=>b.w-a.w);chosen.push(w[0].k);}
  return shuffle(chosen).map(mTask);

function mUpdate(skill,ok){const s=S.m[skill]||{lvl:1,run:0,ok:0,n:0};s.n++;if(ok){s.ok++;s.run=Math.max(s.run,0)+1;if(s.run>=3&&s.lvl<3){s.lvl++;s.run=0;UI.levelUp=SKILLS[skill];}}else{s.run=Math.min(s.run,0)-1;if(s.run<=-2&&s.lvl>1){s.lvl--;s.run=0;}}S.m[skill]=s;}

}

/* ---------- Eingaben ---------- */
function shoot(){const s=$("#shot");if(s&&!reduce()){s.classList.remove("go");s.getBoundingClientRect();s.classList.add("go");}snd("pock");}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act!=="wipe")UI.confirm=null;
  if(UI.justImported&&act!=="bubble")UI.justImported=null;
  switch(act){
   case"tab":UI.view=b.dataset.id;render();break;
   case"home":UI.view="home";render();break;
   case"start":startRun(b.dataset.type);break;
   case"quit":UI.view="home";UI.run=null;try{speechSynthesis.cancel();}catch(e){}render();break;
   case"next":next();break;
   case"pick":answer(+b.dataset.v,ev);break;
   case"key":{const k=b.dataset.k;if(k==="ok"){if(UI.input!=="")answer(UI.input,ev);else talk("Tipp zuerst deine Zahl ein.");}else{if(k==="back")UI.input=UI.input.slice(0,-1);else if(UI.input.length<6)UI.input+=k;snd("tap");const sp=$(".answer span");if(sp)sp.textContent=UI.input;}break;}
   case"speak":speak(b.dataset.t);break;
   case"quiz":{const t=today(),st=S.quiz[t],Q=INHALTE.tennisFragen;if(!st||st.pick!=null)break;st.pick=+b.dataset.v;const ok=st.pick===Q[st.i][2];S.balls+=2;save();snd(ok?"right":"wrong");render();
     const q=$(".quiz");if(q)q.scrollIntoView({block:"center",behavior:reduce()?"auto":"smooth"});flyer(ev.clientX||innerWidth/2,ev.clientY||innerHeight/2,2);break;}
   case"lob":fx(b,"hop");snd("hop");{const [l,a]=pickA(LOB_TALK);talk(fill(l),fill(a));}break;
   case"ace":fx(b,"hop");snd("pock");talk(`Erzähl mal was, ${AN()}!`,pickA(ACE_FACT));break;
   case"bubble":finishType();break;
   case"snd":S.sound=S.sound===false;save();render();snd("pop");break;
   case"len":S.len=b.dataset.v;save();render();break;
   case"npd":S.newPerDay=+b.dataset.v;save();render();break;
   case"pitch":S.pitch=+b.dataset.v;save();render();speak("Hello! Let's play tennis!");break;
   case"voice-test":speak("Hello! I'm "+AN()+", the tennis ball. Let's learn English!");break;
   case"save-set":{S.name=$("#s-name").value.trim();S.lobName=$("#s-lob").value.trim()||"Lobbi";S.aceName=$("#s-ace").value.trim()||"Ace";save();toast("Gespeichert!");render();break;}
   case"import":{const o=oldData();if(o){importOld(o);save();UI.view="home";render();toast("Lernstand übernommen!");}break;}
   case"copy-rep":{const ta=$("#rep");try{await navigator.clipboard.writeText(ta.value);toast("Kopiert!");}catch(e){ta.focus();ta.select();toast("Text markiert, jetzt kopieren.");}break;}
   case"share-rep":{const text=report();try{if(navigator.share){await navigator.share({title:"Lern-Match Wochenbericht",text});return;}}catch(e){if(e&&e.name==="AbortError")return;}toast("Teilen geht hier nicht. Nimm „Kopieren“.");break;}
   case"wipe":if(UI.confirm!=="wipe"){UI.confirm="wipe";render();break;}{const nm=S.name,a=S.aceName,l=S.lobName;S=blank();S.name=nm;S.aceName=a;S.lobName=l;S.setupDone=true;S.imported=true;UI.confirm=null;save();render();toast("Fortschritt zurückgesetzt.");}break;
   default:
    if(SCENE_TALK[act]){const [l,a]=SCENE_TALK[act];if(act==="wuerfli")shoot();else if(act==="fans"){snd("cheer");fx(b,"go");}else{snd("tap");fx(b,"wiggle");}
      if(b.closest(".scene")&&$(".bubble.lob[data-tw]"))talk(fill(l),fill(a));}
  }
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="setup"){S.name=$("#f-name").value.trim();S.lobName=$("#f-lob").value.trim()||"Lobbi";S.aceName=$("#f-ace").value.trim()||"Ace";
    const imp=$("#f-imp");if(imp&&imp.checked)importOld(oldData());else S.imported=true;
    S.setupDone=true;save();render();snd("pop");}
  if(ev.target.id==="en-form"){const v=$("#en-in").value;if(!v.trim()){talk("Schreib zuerst ein Wort.");return;}answer(v,null);}
});
document.addEventListener("input",ev=>{if(ev.target.id==="en-in")UI.input=ev.target.value;});
document.addEventListener("change",ev=>{if(ev.target.id==="s-voice"){S.voice=ev.target.value;save();pickVoice();speak("Hello! Let's play tennis!");}});
document.addEventListener("keydown",ev=>{
  if(UI.view!=="task")return;const t=cur();if(!t)return;
  if(UI.answered&&(ev.key==="Enter")){ev.preventDefault();next();return;}
  if(!UI.answered&&t.subj==="m"&&t.kind==="num"&&!t.intro){
    if(/^[0-9]$/.test(ev.key)&&UI.input.length<6){UI.input+=ev.key;const sp=$(".answer span");if(sp)sp.textContent=UI.input;}
    else if(ev.key==="Backspace"){UI.input=UI.input.slice(0,-1);const sp=$(".answer span");if(sp)sp.textContent=UI.input;}
    else if(ev.key==="Enter"&&UI.input)answer(UI.input,null);
  }
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&window.self===window.top&&window.__SW__)navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
</script>
